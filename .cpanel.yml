---
deployment:
  tasks:
    - export APPPATH=/home/darkftga/nefis-laravel
    - export WEBROOT=/home/darkftga/public_html/nefis.az
    - /bin/mkdir -p $APPPATH
    - /bin/cp -R * $APPPATH
    - /bin/rm -rf $APPPATH/public
    - /bin/cp -R public/* $WEBROOT/
    - /bin/cp -R public/.htaccess $WEBROOT/ 2>/dev/null || true
    - /bin/ln -sfn $APPPATH/storage/app/public $WEBROOT/storage
    # Drop compiled config/route/view caches so the new release is actually used
    - /bin/rm -f $APPPATH/bootstrap/cache/config.php $APPPATH/bootstrap/cache/routes-v7.php $APPPATH/bootstrap/cache/services.php $APPPATH/bootstrap/cache/packages.php
    - /bin/rm -rf $APPPATH/storage/framework/views/*.php
    # No SSH on this account, so the release migrates itself here. The design
    # seeders are gone: the catalogue was cleared on 2026-09-18 for a new approach.
    - export PHPBIN=$(command -v ea-php82 || echo /opt/cpanel/ea-php82/root/usr/bin/php)
    - cd $APPPATH && $PHPBIN artisan migrate --force 2>&1 | tee -a $APPPATH/storage/logs/deploy.log
    # The artwork is served from Yandex Disk; resolve those links before the
    # first visitor arrives rather than making them wait for the lookups.
    - cd $APPPATH && $PHPBIN artisan media:warm 2>&1 | tee -a $APPPATH/storage/logs/deploy.log
    # Catalogue posters linked from Yandex Disk that are not downloaded yet.
    - cd $APPPATH && $PHPBIN artisan products:fetch-posters 2>&1 | tee -a $APPPATH/storage/logs/deploy.log
    # Chocolate bars and their prices (promotions included) from Araz Market.
    # A failure only reports; the bars keep their last prices.
    - cd $APPPATH && $PHPBIN artisan chocolates:sync 2>&1 | tee -a $APPPATH/storage/logs/deploy.log
